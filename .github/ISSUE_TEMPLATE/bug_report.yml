
name: Bug Report
description: Report a problem in an S.A.T. Productions game.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## S.A.T. Productions Bug Report
        Please describe the problem clearly.

  - type: dropdown
    id: project
    attributes:
      label: Game
      options:
        - S.A.T. The Game
        - S.A.T. Secrets of Woodlane
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened?
      placeholder: Describe the problem...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Start the game
        2. ...
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected Result
    validations:
      required: false
      
